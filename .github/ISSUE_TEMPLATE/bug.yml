name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and endpoint
      placeholder: qwen3:14b via Ollama
  - type: input
    id: material
    attributes:
      label: Kind of material
      placeholder: a 40-page PDF lecture script
  - type: textarea
    id: log
    attributes:
      label: Terminal output
      description: What masterly printed. Remove keys and private text first.
      render: text
  - type: input
    id: version
    attributes:
      label: masterly version and OS
      placeholder: 1.0.0 on Windows 11
